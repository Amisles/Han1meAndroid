name: Release Build

# 推送 v* 格式的 tag 时触发（如 v0.1.0、v0.2.0-preview）
on:
  push:
    tags:
      - 'v*'

# 发布 Release 需要写入权限
permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 JDK 17（AGP 9.2 要求 JDK 17+）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 配置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-37
            build-tools;37.0.0

      # 4. 缓存 Gradle 依赖（加速后续构建）
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 5. 将腾讯云镜像替换为官方源（GitHub Actions 服务器在海外，官方源更快）
      - name: Switch Gradle distribution to official source
        run: sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties

      # 6. 从 GitHub Secrets 解码 keystore 文件
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks

      # 7. 生成 keystore.properties（引用上一步解码的 keystore）
      - name: Create keystore.properties
        run: |
          cat > keystore.properties << EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # 8. 授予 gradlew 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 9. 构建 release APK
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 10. 重命名 APK（包含 tag 名，便于识别版本）
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/Hanime-${{ github.ref_name }}.apk

      # 11. 创建 GitHub Release 并上传 APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hanime ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: app/build/outputs/apk/release/Hanime-${{ github.ref_name }}.apk
