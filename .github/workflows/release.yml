# 发布流水线：打 tag 即产出可分发 APK 与校验和，并创建 GitHub Release。
#
# 需要的仓库 Secret（Settings → Secrets and variables → Actions）：
#   RELEASE_KEYSTORE_BASE64   签名密钥库的 base64（必须单行，不能换行）：
#                             Linux/Git Bash: base64 -w0 upload-keystore.jks > keystore.b64
#                             macOS:          base64 -i upload-keystore.jks | tr -d '\n' > keystore.b64
#   RELEASE_STORE_PASSWORD    密钥库口令
#   RELEASE_KEY_ALIAS         密钥别名
#   RELEASE_KEY_PASSWORD      密钥口令
#
# 触发方式：
#   1) push tag：git tag v1.6.0 && git push origin v1.6.0
#   2) 手动：Actions → Release → Run workflow，填 tag，publish 决定是否创建 Release
#
# 版本一致性：tag 必须等于 app/build.gradle.kts 里的 "v" + versionName，否则直接失败。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建的 tag（例如 v1.6.0）
        required: true
        type: string
      publish:
        description: 构建完成后创建 GitHub Release
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  CMDLINE_TOOLS_VERSION: "11076708" # 对应 cmdline-tools 11.0 官方稳定版
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify tag matches versionName
        env:
          TAG_INPUT: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$TAG_INPUT"
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag 必须以 v 开头，当前为 $TAG"; exit 1 ;;
          esac
          version=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -n 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          echo "tag=$TAG versionName=$version versionCode=$code"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag（$TAG）与 versionName（$version）不一致，请先改版本号再打 tag"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download & setup Android cmdline-tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Check signing secrets
        id: signing
        run: |
          set -euo pipefail
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          publish="${{ github.event_name == 'push' || inputs.publish }}"
          if [ -n "$missing" ]; then
            if [ "$publish" = "true" ]; then
              echo "::error::缺少签名 Secret:$missing，无法发布正式版本"
              echo "配置方式见本文件头部说明。"
              exit 1
            fi
            echo "::warning::缺少签名 Secret:$missing，本次只构建 unsigned 包用于验证，不会发布"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::密钥库解码为空，请检查 RELEASE_KEYSTORE_BASE64 是否为单行 base64"
            exit 1
          fi
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace --no-daemon

      - name: Verify signature
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::未找到已签名的 release APK，构建可能未使用签名配置"
            find app/build/outputs/apk -type f || true
            exit 1
          fi
          out=$(apksigner verify --print-certs "$apk")
          echo "$out"
          fingerprint=$(printf '%s\n' "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          if [ -z "$fingerprint" ]; then
            echo "::error::APK 未签名"
            exit 1
          fi
          echo "CERT_SHA256=$fingerprint" >> "$GITHUB_ENV"
          expected="57f0e2d9c9c76da75fdda64761b00c76a4e894d83150f9ea31f05ba30d5f35fe"
          if [ "$fingerprint" != "$expected" ]; then
            echo "::warning::签名指纹与 README 中公开的指纹不一致，请确认是否更换过密钥"
          fi

      - name: Package artifacts
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            src="app/build/outputs/apk/release/app-release.apk"
            name="Han1meAndroid-${TAG}.apk"
          else
            src="app/build/outputs/apk/release/app-release-unsigned.apk"
            name="Han1meAndroid-${TAG}-unsigned.apk"
          fi
          if [ ! -f "$src" ]; then
            echo "::error::未找到 $src"
            find app/build/outputs/apk -type f || true
            exit 1
          fi
          cp "$src" "dist/$name"
          ( cd dist && sha256sum "$name" > "$name.sha256" )
          mapping="app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$mapping" ]; then
            cp "$mapping" "dist/mapping-${TAG}.txt"
          fi
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
          ls -l dist

      - name: Write summary
        run: |
          {
            echo "### ${TAG}"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| versionName | ${VERSION} (versionCode ${VERSION_CODE}) |"
            if [ -n "${CERT_SHA256:-}" ]; then
              echo "| 签名证书 SHA-256 | \`${CERT_SHA256}\` |"
            else
              echo "| 签名 | 未签名（缺少 Secret，仅验证构建） |"
            fi
            echo "| APK | \`${APK_NAME}\` |"
            echo "| APK SHA-256 | \`$(cut -d' ' -f1 "dist/${APK_NAME}.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: dist/
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets=(
            "dist/${APK_NAME}"
            "dist/${APK_NAME}.sha256"
          )
          if [ -f "dist/mapping-${TAG}.txt" ]; then
            assets+=( "dist/mapping-${TAG}.txt" )
          fi
          notes="docs/release-${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖上传资产"
            gh release upload "$TAG" "${assets[@]}" --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" "${assets[@]}" --verify-tag \
              --title "Han1meAndroid-${TAG}" --notes-file "$notes"
          else
            echo "::warning::未找到 ${notes}，改用自动生成的 release notes"
            gh release create "$TAG" "${assets[@]}" --verify-tag \
              --title "Han1meAndroid-${TAG}" --generate-notes
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
